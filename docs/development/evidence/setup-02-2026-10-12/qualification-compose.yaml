services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: setup
      POSTGRES_PASSWORD: setup-only
      POSTGRES_DB: setup
    ports: ["127.0.0.1::5432"]
    tmpfs: ["/var/lib/postgresql:size=512m"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setup -d setup"]
      interval: 3s
      retries: 20
  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-ip=seaweed", "-s3", "-master.volumeSizeLimitMB=32", "-volume.max=16"]
    ports: ["127.0.0.1:58333:8333"]
    tmpfs: ["/data:size=256m"]
    mem_limit: 1g
    cpus: 2
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]
    mem_limit: 256m
    cpus: 0.5
