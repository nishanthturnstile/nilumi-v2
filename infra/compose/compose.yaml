name: nilumi-disposable-dev
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: nilumi_provisioner
      POSTGRES_PASSWORD: ${NILUMI_PROVISIONER_PASSWORD:?Set a disposable provisioning password}
      POSTGRES_DB: nilumi_dev
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nilumi_provisioner -d nilumi_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-ip=seaweed", "-s3", "-master.volumeSizeLimitMB=32", "-volume.max=16"]
    ports: ["127.0.0.1:58333:8333"]
    volumes: ["seaweed-data:/data"]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -O /dev/null http://127.0.0.1:8333/"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    environment:
      MP_DATABASE: /data/mailpit.db
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]
    volumes: ["mailpit-data:/data"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
  otel:
    profiles: ["diagnostics"]
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel.yaml:/etc/otel.yaml:ro"]
    ports: ["127.0.0.1:54318:4318", "127.0.0.1:51313:13133"]
    mem_limit: 256m
    cpus: 0.5
volumes:
  postgres-data:
  seaweed-data:
  mailpit-data:
