# Optional local diagnostics: no external exporter and no log/content pipeline.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  transform:
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["nilumi.code", "nilumi.ready"])
          - set(name, "nilumi.diagnostic")
          - set(status.message, "")
          - set(events, [])
          - set(links, [])
exporters:
  debug:
    verbosity: basic
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform]
      exporters: [debug]
